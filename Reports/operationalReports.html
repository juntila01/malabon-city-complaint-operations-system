<div class="w-full px-2">

    <!-- ============================================
         SUMMARY CARDS
    ============================================= -->

    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-5">

        <!-- Total Events -->

        <div class="bg-white border border-gray-100 rounded-2xl p-5">

            <div class="flex items-center justify-between">

                <div>

                    <p class="text-xs font-semibold uppercase tracking-wider text-gray-400">
                        Total Events
                    </p>

                    <p id="totalEvents"
                        class="mt-2 text-2xl font-bold text-gray-900">
                        0
                    </p>

                </div>

                <div
                    class="flex h-10 w-10 items-center justify-center rounded-xl bg-gray-100 text-gray-500">

                    <i class="fa-solid fa-chart-line text-sm"></i>

                </div>

            </div>

        </div>


        <!-- Citizen Activity -->

        <div class="bg-white border border-gray-100 rounded-2xl p-5">

            <div class="flex items-center justify-between">

                <div>

                    <p class="text-xs font-semibold uppercase tracking-wider text-gray-400">
                        Citizen Activity
                    </p>

                    <p id="citizenEvents"
                        class="mt-2 text-2xl font-bold text-gray-900">
                        0
                    </p>

                </div>

                <div
                    class="flex h-10 w-10 items-center justify-center rounded-xl bg-gray-100 text-gray-500">

                    <i class="fa-solid fa-users text-sm"></i>

                </div>

            </div>

        </div>


        <!-- Staff Activity -->

        <div class="bg-white border border-gray-100 rounded-2xl p-5">

            <div class="flex items-center justify-between">

                <div>

                    <p class="text-xs font-semibold uppercase tracking-wider text-gray-400">
                        Staff Activity
                    </p>

                    <p id="staffEvents"
                        class="mt-2 text-2xl font-bold text-gray-900">
                        0
                    </p>

                </div>

                <div
                    class="flex h-10 w-10 items-center justify-center rounded-xl bg-gray-100 text-gray-500">

                    <i class="fa-solid fa-user-tie text-sm"></i>

                </div>

            </div>

        </div>


        <!-- Dispatch Activity -->

        <div class="bg-white border border-gray-100 rounded-2xl p-5">

            <div class="flex items-center justify-between">

                <div>

                    <p class="text-xs font-semibold uppercase tracking-wider text-gray-400">
                        Dispatch Activity
                    </p>

                    <p id="dispatchEvents"
                        class="mt-2 text-2xl font-bold text-gray-900">
                        0
                    </p>

                </div>

                <div
                    class="flex h-10 w-10 items-center justify-center rounded-xl bg-gray-100 text-gray-500">

                    <i class="fa-solid fa-truck-fast text-sm"></i>

                </div>

            </div>

        </div>

    </div>


    <!-- ============================================
         FILTERS
    ============================================= -->


        <div class="p-5">


            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-3">

                <!-- Search -->

                <div class="relative">

                    <i
                        class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-sm">
                    </i>

                    <input
                        id="searchLogs"
                        type="text"
                        placeholder="Search reports..."
                        class="w-full pl-9 pr-4 py-2.5 rounded-lg border border-gray-200 bg-white text-sm text-gray-700 focus:border-blue-500 focus:outline-none">

                </div>


                <!-- Actor -->

                <select
                    id="actorFilter"
                    class="w-full px-3 py-2.5 rounded-lg border border-gray-200 bg-white text-sm text-gray-700 focus:border-blue-500 focus:outline-none">

                    <option value="">
                        All Actors
                    </option>

                    <option value="Citizen">
                        Citizen
                    </option>

                    <option value="System User">
                        System User
                    </option>

                    <option value="Dispatch Team">
                        Dispatch Team
                    </option>

                    <option value="System">
                        System
                    </option>

                </select>


                <!-- Action -->

                <select
                    id="actionFilter"
                    class="w-full px-3 py-2.5 rounded-lg border border-gray-200 bg-white text-sm text-gray-700 focus:border-blue-500 focus:outline-none">

                    <option value="">
                        All Actions
                    </option>

                    <option value="Complaint Submitted">
                        Complaint Submitted
                    </option>

                    <option value="Complaint Verified">
                        Complaint Verified
                    </option>

                    <option value="Complaint Status Changed">
                        Complaint Status Changed
                    </option>

                    <option value="Dispatch Status Changed">
                        Dispatch Status Changed
                    </option>

                    <option value="Complaint Completed">
                        Complaint Completed
                    </option>

                </select>


                <!-- Date -->

                <input
                    id="dateFilter"
                    type="date"
                    class="w-full px-3 py-2.5 rounded-lg border border-gray-200 bg-white text-sm text-gray-700 focus:border-blue-500 focus:outline-none">

            </div>

        </div>

    <!-- ============================================
         ACTIVITY TABLE
    ============================================= -->

    <div class="bg-white border border-gray-100 rounded-2xl">

        <div class="overflow-x-auto">

            <table class="w-full border-separate border-spacing-0">

                <!-- TABLE HEADER -->

                <thead>

                    <tr class="text-xs uppercase tracking-wider text-gray-500">

                        <th
                            class="sticky top-0 bg-gray-100 z-30 px-6 py-4 text-left border-b border-r border-gray-200 whitespace-nowrap">

                            Date & Time

                        </th>

                        <th
                            class="sticky top-0 bg-gray-100 z-30 px-6 py-4 text-left border-b border-r border-gray-200">

                            Actor

                        </th>

                        <th
                            class="sticky top-0 bg-gray-100 z-30 px-6 py-4 text-left border-b border-r border-gray-200">

                            Action

                        </th>

                        <th
                            class="sticky top-0 bg-gray-100 z-30 px-6 py-4 text-left border-b border-r border-gray-200">

                            Complaint

                        </th>

                        <th
                            class="sticky top-0 bg-gray-100 z-30 px-6 py-4 text-left border-b border-gray-200">

                            Details

                        </th>

                    </tr>

                </thead>


                <!-- TABLE BODY -->

                <tbody
                    id="reportsTableBody"
                    class="divide-y divide-gray-100 bg-white">

                    <tr>

                        <td
                            colspan="5"
                            class="py-16 text-center text-gray-400">

                            Loading operational reports...

                        </td>

                    </tr>

                </tbody>

            </table>


            <!-- ========================================
                 PAGINATION
            ========================================= -->

            <div
                class="px-6 py-4 border-t border-gray-200
                       flex flex-col sm:flex-row
                       items-center justify-between gap-3
                       bg-white">

                <!-- Page Information -->

                <p
                    id="reportsPageInfo"
                    class="text-sm text-gray-500">

                    Showing 0 of 0

                </p>


                <!-- Navigation -->

                <div class="flex items-center gap-2">

                    <button
                        id="prevReportsPage"
                        type="button"
                        class="px-3 py-2 text-sm
                               border border-gray-300
                               rounded-lg
                               bg-white
                               text-gray-600
                               hover:bg-gray-50
                               transition
                               disabled:opacity-40
                               disabled:cursor-not-allowed">

                        <i class="fa-solid fa-chevron-left mr-1"></i>

                        Previous

                    </button>


                    <span
                        id="reportsPageNumber"
                        class="px-3 py-2
                               text-sm
                               font-medium
                               text-gray-700
                               whitespace-nowrap">

                        Page 1 of 1

                    </span>


                    <button
                        id="nextReportsPage"
                        type="button"
                        class="px-3 py-2 text-sm
                               border border-gray-300
                               rounded-lg
                               bg-white
                               text-gray-600
                               hover:bg-gray-50
                               transition
                               disabled:opacity-40
                               disabled:cursor-not-allowed">

                        Next

                        <i class="fa-solid fa-chevron-right ml-1"></i>

                    </button>

                </div>

            </div>

        </div>

    </div>

</div>
