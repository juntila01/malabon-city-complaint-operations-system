<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>Notifications | Malabon CitizenCare</title>

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Inter -->
    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <style>

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: "Inter", sans-serif;
            background: #f8fafc;
            color: #0f172a;

            padding-bottom: 92px;
        }

        button,
        a {
            -webkit-tap-highlight-color: transparent;
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 999px;
        }

        /* ========================================================
           PAGE HEADER
        ======================================================== */

        .notification-header {
            position: sticky;
            top: 0;

            z-index: 40;

            background: rgba(248, 250, 252, 0.94);

            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);

            border-bottom: 1px solid
                rgba(226, 232, 240, 0.8);
        }

        /* ========================================================
           NOTIFICATION ITEM
        ======================================================== */

        .notification-item {
            transition:
                background-color 0.18s ease,
                transform 0.18s ease;
        }

        .notification-item:active {
            transform: scale(0.99);
        }

        .notification-unread {
            background: rgba(239, 246, 255, 0.72);
        }

        .notification-read {
            background: white;
        }

        /* ========================================================
           FLOATING MOBILE NAV
        ======================================================== */

        .mobile-bottom-nav {
            position: fixed;

            left: 0;
            right: 0;
            bottom: 0;

            z-index: 100;

            padding:
                8px
                12px
                calc(8px + env(safe-area-inset-bottom));

            pointer-events: none;
        }

        .mobile-bottom-nav-inner {
            max-width: 560px;

            margin: 0 auto;

            height: 68px;

            background:
                rgba(255, 255, 255, 0.96);

            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);

            border:
                1px solid
                rgba(226, 232, 240, 0.95);

            border-radius: 24px;

            box-shadow:
                0 14px 40px
                rgba(15, 23, 42, 0.13),

                0 2px 8px
                rgba(15, 23, 42, 0.06);

            display: grid;

            grid-template-columns:
                1fr
                1fr
                1.15fr
                1fr
                1fr;

            align-items: center;

            padding: 5px;

            pointer-events: auto;
        }

        .bottom-nav-item {
            height: 58px;

            display: flex;

            flex-direction: column;

            align-items: center;
            justify-content: center;

            gap: 3px;

            border-radius: 18px;

            color: #94a3b8;

            font-size: 9px;
            font-weight: 700;

            transition:
                all 0.2s ease;

            text-decoration: none;

            border: none;

            background: transparent;
        }

        .bottom-nav-item svg {
            width: 20px;
            height: 20px;

            transition:
                transform 0.2s ease,
                color 0.2s ease;
        }

        .bottom-nav-item:hover {
            color: #2563eb;
            background: #f8fafc;
        }

        .bottom-nav-item.active {
            color: #2563eb;
            background: #eff6ff;
        }

        .bottom-nav-item.active svg {
            transform:
                translateY(-1px);
        }

        /* ========================================================
           REPORT BUTTON
        ======================================================== */

        .bottom-report-button {
            position: relative;

            height: 58px;

            display: flex;

            flex-direction: column;

            align-items: center;
            justify-content: center;

            gap: 3px;

            color: white;

            font-size: 9px;
            font-weight: 800;

            border: none;

            background: transparent;
        }

        .bottom-report-icon {
            width: 48px;
            height: 48px;

            margin-top: -25px;

            border-radius: 17px;

            display: flex;

            align-items: center;
            justify-content: center;

            background: #2563eb;

            color: white;

            border:
                4px solid
                #f8fafc;

            box-shadow:
                0 8px 20px
                rgba(37, 99, 235, 0.30);

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease;
        }

        .bottom-report-button:hover
        .bottom-report-icon {
            transform:
                translateY(-2px);

            box-shadow:
                0 11px 25px
                rgba(37, 99, 235, 0.35);
        }

        .bottom-report-button:active
        .bottom-report-icon {
            transform:
                scale(0.95);
        }

        .bottom-report-label {
            color: #2563eb;

            margin-top: 1px;
        }

        /* ========================================================
           DESKTOP
        ======================================================== */

        @media (min-width: 768px) {

            .mobile-bottom-nav {
                padding-left: 24px;
                padding-right: 24px;
            }

            body {
                padding-bottom: 92px;
            }
        }

        /* ========================================================
           MOBILE
        ======================================================== */

        @media (max-width: 640px) {

            body {
                padding-bottom: 88px;
            }

            .notification-header {
                padding-top:
                    env(safe-area-inset-top);
            }

        }

    </style>

</head>


<body>


    <!-- =========================================================
         HEADER
    ========================================================== -->

    <header class="notification-header">

        <div
            class="max-w-3xl mx-auto px-4 sm:px-6"
        >

            <div
                class="min-h-[72px] flex items-center justify-between gap-4"
            >

                <!-- BACK -->

                <button
                    type="button"
                    id="backBtn"
                    class="
                        w-10
                        h-10
                        rounded-xl
                        bg-white
                        border
                        border-slate-200
                        text-slate-600
                        flex
                        items-center
                        justify-center
                        shrink-0
                        hover:bg-slate-50
                        transition
                    "
                    aria-label="Go back"
                >

                    <svg
                        class="w-5 h-5"
                        fill="none"
                        stroke="currentColor"
                        viewBox="0 0 24 24"
                    >

                        <path
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            stroke-width="2"
                            d="M15 19l-7-7 7-7"
                        />

                    </svg>

                </button>


                <!-- TITLE -->

                <div class="min-w-0 flex-1">

                    <h1
                        class="
                            text-lg
                            sm:text-xl
                            font-extrabold
                            text-slate-900
                            truncate
                        "
                    >
                        Notifications
                    </h1>

                    <p
                        id="notificationSubtitle"
                        class="
                            text-xs
                            text-slate-500
                            mt-0.5
                            truncate
                        "
                    >
                        Loading notifications...
                    </p>

                </div>


                <!-- MARK ALL -->

                <button
                    type="button"
                    id="markAllNotificationsBtn"
                    class="
                        hidden
                        text-xs
                        font-bold
                        text-blue-600
                        hover:text-blue-700
                        whitespace-nowrap
                        px-2
                        py-2
                        rounded-lg
                        hover:bg-blue-50
                        transition
                    "
                >
                    Mark all read
                </button>

            </div>

        </div>

    </header>


    <!-- =========================================================
         MAIN
    ========================================================== -->

    <main
        class="
            max-w-3xl
            mx-auto
            px-4
            sm:px-6
            pt-5
            pb-8
        "
    >


        <!-- =====================================================
             PAGE INTRO
        ====================================================== -->

        <section
            class="
                mb-4
                flex
                items-center
                justify-between
                gap-3
            "
        >

            <div>

                <p
                    class="
                        text-[10px]
                        font-bold
                        uppercase
                        tracking-[0.16em]
                        text-slate-400
                    "
                >
                    CitizenCare
                </p>

                <h2
                    class="
                        text-base
                        font-extrabold
                        text-slate-800
                        mt-1
                    "
                >
                    Your updates
                </h2>

            </div>


            <!-- UNREAD BADGE -->

            <div
                id="notificationBadge"
                class="
                    hidden
                    min-w-[28px]
                    h-7
                    px-2
                    rounded-full
                    bg-blue-600
                    text-white
                    text-[11px]
                    font-extrabold
                    flex
                    items-center
                    justify-center
                "
            >
                0
            </div>

        </section>


        <!-- =====================================================
             NOTIFICATION CARD
        ====================================================== -->

        <section
            class="
                bg-white
                border
                border-slate-200
                rounded-2xl
                overflow-hidden
                shadow-sm
            "
        >

            <!-- LOADING -->

            <div
                id="notificationLoading"
                class="
                    px-5
                    py-10
                    flex
                    flex-col
                    items-center
                    justify-center
                    text-center
                "
            >

                <div
                    class="
                        w-10
                        h-10
                        rounded-full
                        border-4
                        border-slate-200
                        border-t-blue-600
                        animate-spin
                        mb-4
                    "
                ></div>

                <p
                    class="
                        text-sm
                        font-semibold
                        text-slate-600
                    "
                >
                    Loading notifications...
                </p>

                <p
                    class="
                        text-xs
                        text-slate-400
                        mt-1
                    "
                >
                    Please wait a moment.
                </p>

            </div>


            <!-- NOTIFICATION LIST -->

            <div
                id="notificationList"
                class="divide-y divide-slate-100"
            ></div>


            <!-- EMPTY -->

            <div
                id="notificationEmpty"
                class="
                    hidden
                    px-6
                    py-14
                    text-center
                "
            >

                <div
                    class="
                        w-14
                        h-14
                        mx-auto
                        rounded-2xl
                        bg-slate-100
                        text-slate-400
                        flex
                        items-center
                        justify-center
                        mb-4
                    "
                >

                    <svg
                        class="w-7 h-7"
                        fill="none"
                        stroke="currentColor"
                        viewBox="0 0 24 24"
                    >

                        <path
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            stroke-width="1.7"
                            d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5"
                        />

                        <path
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            stroke-width="1.7"
                            d="M10 20h4"
                        />

                    </svg>

                </div>


                <h3
                    class="
                        text-sm
                        font-bold
                        text-slate-700
                    "
                >
                    You're all caught up
                </h3>


                <p
                    class="
                        text-xs
                        text-slate-400
                        mt-1
                        max-w-xs
                        mx-auto
                        leading-5
                    "
                >
                    New updates about your complaints
                    and account will appear here.
                </p>

            </div>

        </section>


        <!-- =====================================================
             REFRESH NOTE
        ====================================================== -->

        <p
            class="
                text-center
                text-[10px]
                text-slate-400
                mt-4
            "
        >
            Notifications refresh automatically.
        </p>

    </main>


    <!-- =========================================================
         FLOATING MOBILE / CITIZEN NAVIGATION
    ========================================================== -->

    <nav
        class="mobile-bottom-nav"
        aria-label="Citizen navigation"
    >

        <div
            class="mobile-bottom-nav-inner"
        >

            <!-- HOME -->

            <a
                href="citizen.php"
                class="bottom-nav-item"
            >

                <svg
                    fill="none"
                    stroke="currentColor"
                    viewBox="0 0 24 24"
                >

                    <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="1.8"
                        d="M3 10.5L12 3l9 7.5V21a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1v-10.5z"
                    />

                </svg>

                <span>
                    Home
                </span>

            </a>


            <!-- MY COMPLAINTS -->

            <a
                href="myComplaints.html"
                class="bottom-nav-item"
            >

                <svg
                    fill="none"
                    stroke="currentColor"
                    viewBox="0 0 24 24"
                >

                    <path
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.8"
                        d="M7 3h10a2 2 0 012 2v14a2 2 0 01-2 2H7a2 2 0 01-2-2V5a2 2 0 012-2z"
                    />

                    <path
                        stroke-linecap="round"
                        stroke-width="1.8"
                        d="M8.5 8h7M8.5 12h7M8.5 16h4"
                    />

                </svg>

                <span>
                    Complaints
                </span>

            </a>


            <!-- REPORT -->

            <button
                type="button"
                class="bottom-report-button"
                onclick="window.location.href='../Complaints/complaintForm.html'"
            >

                <span
                    class="bottom-report-icon"
                >

                    <svg
                        class="w-5 h-5"
                        fill="none"
                        stroke="currentColor"
                        viewBox="0 0 24 24"
                    >

                        <path
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            stroke-width="2.4"
                            d="M12 5v14M5 12h14"
                        />

                    </svg>

                </span>


                <span
                    class="bottom-report-label"
                >
                    Report
                </span>

            </button>


            <!-- ALERTS -->

            <button
                type="button"
                class="bottom-nav-item active"
                aria-current="page"
                onclick="window.location.href='notifications.html'"
            >

                <svg
                    fill="none"
                    stroke="currentColor"
                    viewBox="0 0 24 24"
                >

                    <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="1.8"
                        d="M15 17h5l-1.5-2.2V10a6.5 6.5 0 00-13 0v4.8L4 17h5"
                    />

                    <path
                        stroke-linecap="round"
                        stroke-width="1.8"
                        d="M10 20h4"
                    />

                </svg>

                <span>
                    Alerts
                </span>

            </button>


            <!-- PROFILE -->

            <button
                type="button"
                class="bottom-nav-item"
                onclick="window.location.href='citizenProfile.php'"
            >

                <svg
                    fill="none"
                    stroke="currentColor"
                    viewBox="0 0 24 24"
                >

                    <circle
                        cx="12"
                        cy="8"
                        r="3.5"
                        stroke-width="1.8"
                    />

                    <path
                        stroke-linecap="round"
                        stroke-width="1.8"
                        d="M5 21a7 7 0 0114 0"
                    />

                </svg>

                <span>
                    Profile
                </span>

            </button>

        </div>

    </nav>


    <!-- =========================================================
         JAVASCRIPT
    ========================================================== -->

    <script src="notifications.js?v=1"></script>

</body>

</html>
