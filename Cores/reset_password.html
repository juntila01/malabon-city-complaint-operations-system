<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Reset Password - MCAT</title>

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- FontAwesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

</head>


<body class="bg-white min-h-screen flex items-center justify-center px-6 py-10">

    <div class="w-full max-w-md">


        <!-- ========================================= -->
        <!-- HEADER -->
        <!-- ========================================= -->

        <div class="text-center mb-10">

            <!-- Logo -->
            <div class="flex justify-center mb-8">

                <div
                    class="w-16 h-16 rounded-full bg-blue-600 flex items-center justify-center shadow-lg shadow-blue-200">

                    <i class="fa-solid fa-lock text-white text-2xl"></i>

                </div>

            </div>


            <h1 class="text-3xl font-bold text-gray-900">
                Reset Password
            </h1>

            <p class="text-gray-500 mt-2">
                Create a new password for your account
            </p>

        </div>



        <!-- ========================================= -->
        <!-- CARD -->
        <!-- ========================================= -->

        <div class="w-full">


            <!-- ===================================== -->
            <!-- LOADING -->
            <!-- ===================================== -->

            <div
                id="loadingState"
                class="text-center py-10">

                <i
                    class="fa-solid fa-spinner fa-spin text-blue-600 text-3xl">
                </i>

                <p class="text-gray-500 mt-4">
                    Validating reset link...
                </p>

            </div>



            <!-- ===================================== -->
            <!-- INVALID TOKEN -->
            <!-- ===================================== -->

            <div
                id="invalidState"
                class="hidden text-center py-8">

                <div
                    class="w-16 h-16 mx-auto rounded-full bg-red-100 flex items-center justify-center">

                    <i
                        class="fa-solid fa-circle-xmark text-red-600 text-3xl">
                    </i>

                </div>


                <h2
                    class="text-xl font-bold text-gray-900 mt-5">

                    Invalid or Expired Link

                </h2>


                <p
                    id="invalidMessage"
                    class="text-gray-500 mt-2">

                    This password reset link is invalid or has expired.

                </p>


                <a
                    href="forgot_password.html"
                    class="inline-block mt-6 bg-blue-600 hover:bg-blue-700 text-white font-semibold px-6 py-3 rounded-xl transition">

                    Request New Link

                </a>

            </div>



            <!-- ===================================== -->
            <!-- RESET FORM -->
            <!-- ===================================== -->

            <form
                id="resetPasswordForm"
                class="hidden">


                <!-- ================================= -->
                <!-- ACCOUNT -->
                <!-- ================================= -->

                <div class="mb-7">

                    <label
                        class="block text-sm font-semibold text-gray-800 mb-2">

                        Account

                    </label>


                    <div
                        class="bg-gray-50 border border-gray-200 rounded-xl px-4 py-3">

                        <div class="flex items-center gap-3">

                            <div
                                class="w-10 h-10 rounded-full bg-blue-100 flex items-center justify-center">

                                <i
                                    class="fa-solid fa-user text-blue-600">
                                </i>

                            </div>


                            <div class="min-w-0">

                                <p
                                    id="accountName"
                                    class="font-semibold text-gray-900 truncate">

                                    --

                                </p>


                                <p
                                    id="accountEmail"
                                    class="text-sm text-gray-500 truncate">

                                    --

                                </p>

                            </div>

                        </div>

                    </div>

                </div>



                <!-- ================================= -->
                <!-- NEW PASSWORD -->
                <!-- ================================= -->

                <div class="mb-6">

                    <label
                        for="newPassword"
                        class="block text-sm font-semibold text-gray-800 mb-2">

                        New Password

                    </label>


                    <div class="relative">

                        <input
                            type="password"
                            id="newPassword"
                            name="newPassword"
                            required
                            minlength="8"
                            autocomplete="new-password"
                            placeholder="Enter new password"
                            class="w-full border border-gray-200 bg-gray-50 rounded-xl px-4 py-3.5 pr-12 text-gray-900 placeholder-gray-400 outline-none transition focus:bg-white focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20">


                        <button
                            type="button"
                            id="toggleNewPassword"
                            class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 transition">

                            <i class="fa-solid fa-eye"></i>

                        </button>

                    </div>


                    <!-- Password Strength -->

                    <p
                        id="passwordStrength"
                        class="hidden mt-2 text-sm font-medium">

                    </p>

                </div>



                <!-- ================================= -->
                <!-- CONFIRM PASSWORD -->
                <!-- ================================= -->

                <div class="mb-7">

                    <label
                        for="confirmPassword"
                        class="block text-sm font-semibold text-gray-800 mb-2">

                        Confirm Password

                    </label>


                    <div class="relative">

                        <input
                            type="password"
                            id="confirmPassword"
                            name="confirmPassword"
                            required
                            minlength="8"
                            autocomplete="new-password"
                            placeholder="Confirm your password"
                            class="w-full border border-gray-200 bg-gray-50 rounded-xl px-4 py-3.5 pr-12 text-gray-900 placeholder-gray-400 outline-none transition focus:bg-white focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20">


                        <button
                            type="button"
                            id="toggleConfirmPassword"
                            class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 transition">

                            <i class="fa-solid fa-eye"></i>

                        </button>

                    </div>


                    <!-- Password Match -->

                    <p
                        id="passwordMatch"
                        class="hidden mt-2 text-sm font-medium">

                    </p>

                </div>



                <!-- ================================= -->
                <!-- RESET BUTTON -->
                <!-- ================================= -->

                <button
                    type="submit"
                    id="resetBtn"
                    disabled
                    class="w-full py-3.5 bg-gray-400 text-white font-bold rounded-xl cursor-not-allowed transition-all">

                    <span id="resetButtonText">
                        Reset Password
                    </span>

                    <i class="fa-solid fa-key ml-2"></i>

                </button>


            </form>

        </div>



        <!-- ========================================= -->
        <!-- FOOTER -->
        <!-- ========================================= -->

        <p
            class="text-center text-gray-400 text-sm mt-8">

            MCAT Complaint Management System

        </p>

    </div>


    <script src="reset_password.js"></script>

</body>

</html>
