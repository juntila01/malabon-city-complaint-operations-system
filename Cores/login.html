<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Complaint System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-blue-50 text-slate-900">
    <div class="min-h-screen flex flex-col items-center justify-center p-4 sm:p-6 md:p-8">
        
        <div class="w-full max-w-[440px] bg-white rounded-2xl shadow-xl p-6 sm:p-10 border border-blue-100">
            
            <div class="text-center mb-8 sm:mb-10">
                <div class="inline-flex items-center justify-center w-20 h-20 sm:w-24 sm:h-24 mb-6 transition-transform hover:scale-105">
                    <img src="../assets/ahon.png" alt="Malabon City Logo" class="w-full h-full object-contain">
                </div>
                <h2 class="text-2xl sm:text-3xl font-bold text-gray-900 tracking-tight">Welcome Back</h2>
                <p class="text-sm sm:text-base text-gray-500 mt-2">Malabon City Complaint System</p>
            </div>
            
            <div id="error-banner" class="hidden mb-6 p-4 bg-red-50 border border-red-200 rounded-xl text-sm text-red-600 font-medium">
                Invalid email address or password. Please try again.
            </div>

            <form id="loginForm"
                    action="login.php"
                    method="POST"
                    autocomplete="off"
                    class="space-y-5 sm:space-y-6">
                <div>
                    <label for="email" class="block text-sm font-semibold text-gray-700 mb-2 ml-1">Email Address</label>
                    <input type="email"
                                id="email"
                                name="email"
                                autocomplete="off"
                                required
                           class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:bg-white focus:border-transparent outline-none transition-all text-sm sm:text-base" 
                           placeholder="name@malabon.gov.ph">
                </div>

                <div>
                    <div class="flex justify-between items-center mb-2 px-1">
                        <label for="password" class="text-sm font-semibold text-gray-700">Password</label>
                        <a href="forgot_password.php" class="text-xs sm:text-sm text-blue-600 font-medium hover:text-blue-700 hover:underline">Forgot?</a>
                    </div>
                    
                    <div class="relative flex items-center">
                        <input type="password"
                                id="password"
                                name="password"
                                autocomplete="new-password"
                                required
                               class="w-full px-4 py-3 pr-12 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:bg-white focus:border-transparent outline-none transition-all text-sm sm:text-base" 
                               placeholder="••••••••">
                        
                        <button type="button" id="password-toggle" class="absolute right-4 text-gray-400 hover:text-gray-600 focus:outline-none transition-colors">
                            <svg id="eye-icon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
                            </svg>
                            <svg id="eye-off-icon" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18"></path>
                            </svg>
                        </button>
                    </div>
                </div>

                <button type="submit" 
                        class="w-full py-3.5 sm:py-4 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow-lg shadow-blue-200 transition-all active:scale-[0.98] focus:ring-4 focus:ring-blue-500/20">
                    Log In
                </button>
            </form>

            <!-- Google Login -->
            <div class="flex items-center gap-3 my-6">
                <div class="flex-1 h-px bg-gray-200"></div>
                <span class="text-xs font-medium text-gray-400 uppercase">or</span>
                <div class="flex-1 h-px bg-gray-200"></div>
            </div>

            <div class="flex justify-center">
                <div id="googleLoginButton"></div>
            </div>

            <div class="mt-6 text-center text-sm">
                <span class="text-gray-500">Don't have an account?</span>
                <a href="register.html" class="text-blue-600 font-semibold hover:text-blue-700 hover:underline ml-1">Sign Up</a>
            </div>

            <div class="mt-8 text-center">
                <p class="text-xs text-slate-400">© 2026 Malabon Action Team</p>
            </div>
        </div>
    </div>

    <script>
        const passwordInput = document.getElementById('password');
        const toggleButton = document.getElementById('password-toggle');
        const eyeIcon = document.getElementById('eye-icon');
        const eyeOffIcon = document.getElementById('eye-off-icon');

        toggleButton.addEventListener('click', function () {
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.classList.add('hidden');
                eyeOffIcon.classList.remove('hidden');
            } else {
                passwordInput.type = 'password';
                eyeIcon.classList.remove('hidden');
                eyeOffIcon.classList.add('hidden');
            }
        });

        const params = new URLSearchParams(window.location.search);

        const banner = document.getElementById("error-banner");
        const submitBtn = document.querySelector("button[type='submit']");

        if (params.get("error") === "invalid_credentials") {
            banner.classList.remove("hidden");
            banner.textContent = "Invalid email address or password.";
        }

        if (params.has("locked")) {

            let seconds = parseInt(params.get("locked"));

            submitBtn.disabled = true;
            banner.classList.remove("hidden");

            function countdown() {

                let m = Math.floor(seconds / 60);
                let s = seconds % 60;

                banner.innerHTML =
                    `Too many failed login attempts.<br>Please wait <strong>${m}:${String(s).padStart(2,'0')}</strong> before trying again.`;

                if (seconds <= 0) {
                    submitBtn.disabled = false;
                    banner.classList.add("hidden");
                    history.replaceState({}, "", window.location.pathname);
                    return;
                }

                seconds--;
                setTimeout(countdown, 1000);
            }

            countdown();
        }

        // ============================================================
        // CLEAR LOGIN FORM WHEN PAGE IS RESTORED FROM BROWSER HISTORY
        // ============================================================

        window.addEventListener("pageshow", function (event) {

            if (event.persisted) {

                const loginForm = document.getElementById("loginForm");
                const emailInput = document.getElementById("email");
                const passwordInput = document.getElementById("password");

                if (loginForm) {
                    loginForm.reset();
                }

                if (emailInput) {
                    emailInput.value = "";
                }

                if (passwordInput) {
                    passwordInput.value = "";
                }

                // Make sure password is hidden again
                if (passwordInput) {
                    passwordInput.type = "password";
                }

                eyeIcon.classList.remove("hidden");
                eyeOffIcon.classList.add("hidden");
            }

        });


        // ============================================================
        // GOOGLE LOGIN
        // ============================================================

        function handleGoogleLogin(response) {

            if (!response || !response.credential) {

                const banner =
                    document.getElementById("error-banner");

                banner.textContent =
                    "Google authentication failed. Please try again.";

                banner.classList.remove("hidden");

                return;
            }

            const formData = new FormData();

            formData.append(
                "credential",
                response.credential
            );

            fetch("google_login.php", {
                method: "POST",
                body: formData,
                credentials: "same-origin"
            })
            .then(async response => {

                const result = await response.json();

                if (!response.ok || !result.success) {
                    throw new Error(
                        result.message || "Google login failed."
                    );
                }

                if (result.redirect) {
                    window.location.href = result.redirect;
                }
            })
            .catch(error => {

                console.error(
                    "Google login error:",
                    error
                );

                const banner =
                    document.getElementById("error-banner");

                banner.textContent =
                    error.message ||
                    "Unable to sign in with Google. Please try again.";

                banner.classList.remove("hidden");

                window.scrollTo({
                    top: 0,
                    behavior: "smooth"
                });
            });
        }


        // ============================================================
        // INITIALIZE GOOGLE IDENTITY SERVICES
        // ============================================================

        window.addEventListener("load", function () {

            if (
                typeof google === "undefined" ||
                !google.accounts ||
                !google.accounts.id
            ) {
                console.error(
                    "Google Identity Services did not load."
                );

                return;
            }

            google.accounts.id.initialize({

                client_id:
                    "964361808717-6k3d0petdsj3v3c2kqlvjqabv9fhefjj.apps.googleusercontent.com",

                callback:
                    handleGoogleLogin,

                ux_mode:
                    "popup"
            });

            const googleButton =
                document.getElementById("googleLoginButton");

            if (!googleButton) {
                console.error(
                    "Google login button container was not found."
                );

                return;
            }

            google.accounts.id.renderButton(
                googleButton,
                {
                    theme: "outline",
                    size: "large",
                    width: 360,
                    text: "signin_with",
                    shape: "rectangular",
                    logo_alignment: "left"
                }
            );
        });
    </script>
</body>
</html>
